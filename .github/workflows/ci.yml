name: CI — Pruebas y Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar y ejecutar todas las pruebas
        run: |
          mvn -B verify --no-transfer-progress --errors > maven.log 2>&1 || {
            STATUS=$?
            cat maven.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b ci-log
            git add -f maven.log
            if [ -d target/surefire-reports ]; then
              git add -f target/surefire-reports/
            fi
            git commit -m "ci log failure"
            git push -f origin ci-log
            exit $STATUS
          }
