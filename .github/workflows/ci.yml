name: CI — Pruebas y Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar y ejecutar todas las pruebas
        run: mvn -B verify --no-transfer-progress --errors

      - name: Diagnostico de errores
        if: failure()
        run: |
          echo "=== ARCHIVOS EN TARGET ==="
          find target -type f -name "*.txt" -o -name "*.dump*" -o -name "*.log" | while read -r file; do
            echo "=== CONTENIDO DE $file ==="
            cat "$file"
          done
